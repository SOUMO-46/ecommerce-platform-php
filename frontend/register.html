<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyShop | Register</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><form class="form-card" id="registerForm"><h2>Create your account</h2><p class="muted" style="text-align:center">Join MyShop and start shopping.</p><div class="form-group"><label for="name">Full name</label><input id="name" placeholder="Your name" required></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></div><button class="btn" style="width:100%">Create Account</button><div id="msg" class="message" style="display:none"></div><p class="form-link">Already registered? <a href="login.html">Login</a></p></form></main><script src="js/ui.js"></script><script src="js/auth.js"></script></body></html>
